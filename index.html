<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>离线二维码生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px 16px 48px;
        background: #f5f5f5;
        color: #222;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.5vw, 2.2rem);
        text-align: center;
      }
      .card {
        width: min(960px, 100%);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        padding: clamp(16px, 3vw, 32px);
        display: grid;
        gap: 24px;
      }
      .card section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      textarea {
        resize: vertical;
        min-height: 180px;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Courier New", monospace;
        font-size: 0.95rem;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #d0d7de;
        outline: none;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      label {
        font-weight: 600;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.95rem;
      }
      select,
      input[type="number"] {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d0d7de;
        font-size: 0.95rem;
      }
      .controls {
        display: grid;
        gap: 16px;
      }
      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .controls-row label {
        flex: 1 1 140px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      button.primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
      }
      button.secondary {
        background: #e2e8f0;
        color: #111827;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        box-shadow: none;
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .qr-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        padding: clamp(24px, 4vw, 40px);
        min-height: 320px;
      }
      #qr-output canvas {
        max-width: min(360px, 80vw);
        height: auto;
      }
      .status {
        font-size: 0.9rem;
        color: #475569;
        min-height: 1.2em;
      }
      footer {
        font-size: 0.85rem;
        color: #6b7280;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
        .card,
        .qr-wrapper {
          background: #1f2937;
          border-color: #334155;
        }
        textarea,
        select,
        input[type="number"] {
          background: #111827;
          color: #e2e8f0;
          border-color: #334155;
        }
        button.secondary {
          background: #1e293b;
          color: #e2e8f0;
        }
        .status {
          color: #cbd5f5;
        }
      }
    </style>
  </head>
  <body>
    <h1>离线二维码生成器</h1>
    <div class="card">
      <section>
        <label for="qr-input">
          输入文本
          <textarea id="qr-input" placeholder="在此粘贴或输入需要编码的文本，支持换行和 UTF-8 字符。"></textarea>
        </label>
        <div class="controls">
          <div class="controls-row">
            <label>
              纠错级别
              <select id="error-level">
                <option value="L">L — 7% 容错</option>
                <option value="M" selected>M — 15% 容错</option>
                <option value="Q">Q — 25% 容错</option>
                <option value="H">H — 30% 容错</option>
              </select>
            </label>
            <label>
              每模块像素（整数）
              <input id="pixel-size" type="number" min="1" max="40" step="1" value="10" />
            </label>
            <label>
              边距（模块数）
              <input id="margin" type="number" min="0" max="20" step="1" value="4" />
            </label>
          </div>
          <div class="actions">
            <button id="generate" class="primary">生成二维码</button>
            <button id="clear" class="secondary">清空</button>
            <button id="prev" class="secondary" disabled>上一张</button>
            <button id="next" class="secondary" disabled>下一张</button>
            <button id="download" class="secondary" disabled>下载 PNG</button>
          </div>
          <p class="status" id="status" aria-live="polite"></p>
          <p class="status" id="page-meta" aria-live="polite"></p>
        </div>
      </section>
      <section class="qr-wrapper">
        <div id="qr-output" aria-live="polite" aria-busy="false">
          <p>二维码将在这里展示。</p>
        </div>
      </section>
    </div>
    <footer>
      采用开源 <code>qrcode-generator</code> 库，本地运行，无需网络即可生成二维码。
    </footer>

    <script src="./qrcode-generator.js"></script>
    <script>
      const inputEl = document.getElementById('qr-input');
      const levelEl = document.getElementById('error-level');
      const pixelSizeEl = document.getElementById('pixel-size');
      const marginEl = document.getElementById('margin');
      const generateBtn = document.getElementById('generate');
      const clearBtn = document.getElementById('clear');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const downloadBtn = document.getElementById('download');
      const statusEl = document.getElementById('status');
      const pageMetaEl = document.getElementById('page-meta');
      const outputEl = document.getElementById('qr-output');

      let lastCanvas = null;
      const textEncoder = new TextEncoder();
      let pages = [];
      let currentPageIndex = 0;
      let currentErrorLevel = 'M';

      if (typeof qrcode !== 'undefined') {
        qrcode.stringToBytes = function(str) {
          return Array.from(textEncoder.encode(str));
        };
      }

      function autoCreateQRCode(text, errorLevel) {
        for (let typeNumber = 1; typeNumber <= 40; typeNumber++) {
          const qr = qrcode(typeNumber, errorLevel);
          try {
            qr.addData(text);
            qr.make();
            return qr;
          } catch (err) {
            continue;
          }
        }
        throw new Error('文本超出二维码可编码容量，请缩短内容或降低纠错级别。');
      }

      function renderToCanvas(qr, pixelSize, margin) {
        const moduleCount = qr.getModuleCount();
        const totalModules = moduleCount + margin * 2;
        const scale = Math.max(1, Math.floor(pixelSize));
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = totalModules * scale;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            if (qr.isDark(row, col)) {
              const x = (margin + col) * scale;
              const y = (margin + row) * scale;
              ctx.fillRect(x, y, scale, scale);
            }
          }
        }
        return canvas;
      }

      function createQrPages(text, errorLevel) {
        try {
          const qr = autoCreateQRCode(text, errorLevel);
          const moduleCount = qr.getModuleCount();
          const version = Math.round((moduleCount - 17) / 4);
          return [
            {
              qr,
              moduleCount,
              version
            }
          ];
        } catch (error) {
          return splitLongText(text, errorLevel);
        }
      }

      function splitLongText(text, errorLevel) {
        const codePoints = Array.from(text);
        const result = [];
        let start = 0;

        while (start < codePoints.length) {
          let low = start + 1;
          let high = codePoints.length;
          let best = null;

          while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            const slice = codePoints.slice(start, mid).join('');

            try {
              const qr = autoCreateQRCode(slice, errorLevel);
              const moduleCount = qr.getModuleCount();
              const version = Math.round((moduleCount - 17) / 4);
              best = {
                qr,
                end: mid,
                moduleCount,
                version
              };
              low = mid + 1;
            } catch (err) {
              high = mid - 1;
            }
          }

          if (!best) {
            throw new Error('即使拆分后仍无法生成二维码，请尝试降低纠错级别或缩短文本。');
          }

          result.push({
            qr: best.qr,
            moduleCount: best.moduleCount,
            version: best.version
          });
          start = best.end;
        }

        return result;
      }

      function showPage(index) {
        if (!pages.length) {
          return;
        }

        if (index < 0 || index >= pages.length) {
          return;
        }

        currentPageIndex = index;
        const page = pages[index];
        outputEl.innerHTML = '';
        outputEl.appendChild(page.canvas);
        lastCanvas = page.canvas;

        const total = pages.length;
        const size = page.canvas.width;
        const detail = total === 1
          ? `单张二维码：版本 ${page.version}，模块 ${page.moduleCount}×${page.moduleCount}，纠错级别 ${currentErrorLevel}，图像 ${size}px × ${size}px。`
          : `当前第 ${index + 1}/${total} 张：版本 ${page.version}，模块 ${page.moduleCount}×${page.moduleCount}，纠错级别 ${currentErrorLevel}，图像 ${size}px × ${size}px。`;
        pageMetaEl.textContent = detail;

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === total - 1;
        downloadBtn.disabled = false;
      }

      function updateStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? '#dc2626' : '';
      }

      function generate() {
        const text = inputEl.value;
        if (!text) {
          outputEl.innerHTML = '<p>请输入需要编码的文本。</p>';
          downloadBtn.disabled = true;
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          lastCanvas = null;
          pages = [];
          pageMetaEl.textContent = '';
          updateStatus('请先输入需要编码的文本。');
          return;
        }

        const errorLevel = levelEl.value;
        const pixelSize = Math.max(1, Number(pixelSizeEl.value) || 10);
        const margin = Math.max(0, Math.floor(Number(marginEl.value) || 4));

        try {
          const generatedPages = createQrPages(text, errorLevel).map((page) => {
            const { qr, moduleCount, version } = page;
            const canvas = renderToCanvas(qr, pixelSize, margin);
            return {
              moduleCount,
              version,
              canvas
            };
          });

          pages = generatedPages;
          currentPageIndex = 0;
          currentErrorLevel = errorLevel;

          if (pages.length === 1) {
            const page = pages[0];
            updateStatus(`生成成功：版本 ${page.version}，模块 ${page.moduleCount}×${page.moduleCount}，纠错级别 ${errorLevel}，图像 ${page.canvas.width}px × ${page.canvas.height}px。`);
          } else {
            updateStatus(`文本较长，已拆分为 ${pages.length} 张二维码，请使用 "上一张/下一张" 按顺序扫描并拼接完整文本。如需减少张数，可尝试降低纠错级别。`);
          }

          showPage(0);
        } catch (error) {
          outputEl.innerHTML = '';
          lastCanvas = null;
          downloadBtn.disabled = true;
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          pages = [];
          currentPageIndex = 0;
          pageMetaEl.textContent = '';
          updateStatus(error.message, true);
        }
      }

      function clearAll() {
        inputEl.value = '';
        outputEl.innerHTML = '<p>二维码将在这里展示。</p>';
        lastCanvas = null;
        downloadBtn.disabled = true;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        pages = [];
        currentPageIndex = 0;
        pageMetaEl.textContent = '';
        updateStatus('');
        inputEl.focus();
      }

      function downloadPng() {
        if (!lastCanvas) return;
        const link = document.createElement('a');
        const suffix = pages.length > 1 ? `-part-${currentPageIndex + 1}of${pages.length}` : '';
        link.download = `qr${suffix}-${Date.now()}.png`;
        link.href = lastCanvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      generateBtn.addEventListener('click', generate);
      clearBtn.addEventListener('click', clearAll);
      prevBtn.addEventListener('click', () => {
        if (currentPageIndex > 0) {
          showPage(currentPageIndex - 1);
        }
      });
      nextBtn.addEventListener('click', () => {
        if (currentPageIndex < pages.length - 1) {
          showPage(currentPageIndex + 1);
        }
      });
      downloadBtn.addEventListener('click', downloadPng);
      inputEl.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          generate();
        }
      });
    </script>
  </body>
</html>
